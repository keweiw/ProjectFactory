name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "project/tickread/code/**"
      - "project/16personality/**"
      - ".github/workflows/deploy-tickread.yml"
  # Build and test pull requests too, so a PR has something to go green on.
  # The deploy job below is guarded to keep publishing a master-only action.
  pull_request:
    branches: [master]
    paths:
      - "project/tickread/code/**"
      - "project/16personality/**"
      - ".github/workflows/deploy-tickread.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Scoped per ref rather than one global "pages" group. With pull requests now
# building, a shared group plus cancel-in-progress would let a PR build cancel an
# in-flight master deploy. Per ref keeps the intended behaviour — a newer push to a
# branch supersedes its own older run — without PRs interfering with production.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the compiler
        run: npm install -g typescript@7.0.2

      - name: Compile tickread
        working-directory: project/tickread/code
        run: tsc -p .

      - name: Test tickread
        working-directory: project/tickread/code
        run: node dist/tests/run.js

      - name: Compile 16personality
        working-directory: project/16personality
        run: tsc -p .

      - name: Assemble site
        run: |
          mkdir -p _site/dist/src
          cp project/tickread/code/index.html project/tickread/code/style.css _site/
          cp -r project/tickread/code/data _site/data
          cp -r project/tickread/code/src _site/src
          cp -r project/tickread/code/dist/src _site/dist/src

          mkdir -p _site/16personality/dist
          cp project/16personality/index.html project/16personality/style.css _site/16personality/
          cp -r project/16personality/assets _site/16personality/assets
          cp project/16personality/dist/app.js _site/16personality/dist/app.js

      # A pull request still assembles the site, which is what proves the copy
      # paths are right, but it has no deploy job to consume the artifact.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    # Never publish from a pull request — a PR must be able to fail safely.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
