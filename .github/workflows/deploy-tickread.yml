name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "project/tickread/code/**"
      - "project/16personality/**"
      - ".github/workflows/deploy-tickread.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the compiler
        run: npm install -g typescript@7.0.2

      - name: Compile tickread
        working-directory: project/tickread/code
        run: tsc -p .

      - name: Test tickread
        working-directory: project/tickread/code
        run: node dist/tests/run.js

      - name: Compile 16personality
        working-directory: project/16personality
        run: tsc -p .

      - name: Assemble site
        run: |
          mkdir -p _site/dist/src
          cp project/tickread/code/index.html project/tickread/code/style.css _site/
          cp -r project/tickread/code/data _site/data
          cp -r project/tickread/code/src _site/src
          cp -r project/tickread/code/dist/src _site/dist/src

          mkdir -p _site/16personality/dist
          cp project/16personality/index.html project/16personality/style.css _site/16personality/
          cp -r project/16personality/assets _site/16personality/assets
          cp project/16personality/dist/app.js _site/16personality/dist/app.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
