<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#151718">
    <title>tickread mobile</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <section id="home-screen" class="screen">
        <p class="eyebrow">MARKET INTUITION TRAINING</p>
        <h1>tickread</h1>
        <p id="lifetime" class="muted">No history yet</p>
        <button id="start-button" class="primary">Start 10 questions</button>
        <p class="fine-print">Training only — not investment advice.</p>
      </section>
      <section id="game-screen" class="screen" hidden>
        <header class="game-header"><span id="meta"></span><span id="counter"></span></header>
        <div class="streak" id="streak">Streak 0</div>
        <h2>Where does price go?</h2>
        <canvas id="chart" aria-label="Price chart" role="img"></canvas>
        <p id="swipe-hint" class="muted">Swipe up for bullish · down for bearish</p>
        <div id="actions" class="actions">
          <button id="down-button" class="down">↓ Bearish<br><small>Falls</small></button>
          <button id="up-button" class="up">↑ Bullish<br><small>Rises</small></button>
        </div>
        <section id="result" class="result" aria-live="polite" hidden></section>
        <button id="next-button" class="primary" hidden>Next question</button>
      </section>
      <section id="report-screen" class="screen" hidden>
        <p class="eyebrow">ROUND COMPLETE</p><h2 id="report-title"></h2><p id="report-streak" class="muted"></p>
        <div id="report-list" class="report-list"></div>
        <button id="again-button" class="primary">Play again</button>
        <button id="home-button" class="secondary">Back home</button>
      </section>
    </main>
    <script type="module" src="dist/app.js"></script>
  </body>
</html>
